<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b7a3b" />
  <title>Pitole — turnieje HaxBall 2v2</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff' stroke='%230b7a3b' stroke-width='3'/%3E%3Cpath d='M16 8l6 4-2 7h-8l-2-7z' fill='%230b7a3b'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- Przerwa techniczna (włącz/wyłącz: stała MAINTENANCE w api/index.php) -->
  <div id="maintenance" class="login hidden">
    <div class="login-card">
      <svg class="gear" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
      </svg>
      <h1>Pitole</h1>
      <p class="muted">Strona chwilowo niedostępna — trwają prace techniczne.<br />Zajrzyj za chwilę.</p>
    </div>
  </div>

  <!-- Brama logowania -->
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="login-logo">⚽</div>
      <h1>Pitole</h1>
      <p class="muted">Turnieje HaxBall 2v2</p>
      <input id="login-pass" type="password" placeholder="Hasło ekipy" autocomplete="current-password" />
      <button type="submit" class="btn btn-primary">Zaloguj</button>
      <div id="login-error" class="error"></div>
      <p class="app-version js-version muted"></p>
    </form>
  </div>

  <!-- Aplikacja -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">⚽ Pitole <span class="app-version js-version"></span></div>
      <nav class="tabs">
        <button class="tab" data-tab="turniej">Turniej</button>
        <button class="tab" data-tab="statystyki">Statystyki</button>
        <button class="tab" data-tab="historia">Historia</button>
        <button class="tab" data-tab="gracze">Gracze</button>
      </nav>
      <button id="logout-btn" class="link-btn" title="Wyloguj">Wyloguj</button>
    </header>

    <main id="view" class="view"><!-- render dynamiczny --></main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
